<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SERMONcoach</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400;0,600;0,700;1,400&family=Source+Sans+3:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap');

  :root {
    --navy: #1A3A5C;
    --navy-deep: #0F2640;
    --navy-light: #243F5C;
    --teal: #2A7FA5;
    --teal-light: #EAF4FA;
    --teal-border: #B0D8EC;
    --gold: #B8860B;
    --gold-light: #FDF6E3;
    --green: #1B6E3A;
    --green-light: #EAF5EE;
    --red: #B0271D;
    --red-light: #FDECEA;
    --gray-mid: #9096A3;
    --gray-light: #D8DAE0;
    --white: #FFFFFF;
    --offwhite: #F7F8FA;
    --charcoal: #2C2E33;
    --font-display: 'Lora', 'Georgia', serif;
    --font-body: 'Source Sans 3', 'Helvetica Neue', sans-serif;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: var(--font-body);
    font-size: 14px;
    background: var(--navy-deep);
    color: var(--white);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
  }

  /* ── Nav ── */
  nav {
    background: var(--navy);
    height: 48px;
    display: flex;
    align-items: center;
    padding: 0 20px;
    gap: 12px;
    flex-shrink: 0;
    position: relative;
  }

  nav .brand-showem {
    position: absolute;
    left: 50%;
    top: 50%;
    transform: translate(-50%, -50%);
    font-family: var(--font-display);
    font-size: 16px; font-weight: 700;
    letter-spacing: 0;
    pointer-events: none;
    white-space: nowrap;
  }

  nav .brand-showem .sw-white { color: var(--white); }
  nav .brand-showem .sw-gold { color: var(--gold); }

  @media (max-width: 640px) {
    nav .brand-showem { display: none; }
  }

  nav .logo-mark {
    width: 24px; height: 24px;
    background: var(--teal);
    border-radius: 3px;
  }

  nav h1 {
    font-family: var(--font-display);
    font-size: 16px; font-weight: 700;
    color: var(--white);
    letter-spacing: 0;
  }

  nav h1 .brand-caps {
    text-transform: uppercase;
    letter-spacing: 0.04em;
  }

  nav h1 .brand-lower {
    text-transform: lowercase;
    font-family: var(--font-body);
    font-weight: 400;
    color: #D0D6DC;
    letter-spacing: 0;
  }

  .nav-links {
    margin-left: auto;
    display: flex; gap: 16px;
  }

  .nav-links button {
    background: none; border: none;
    color: #8BAAC4; font-family: var(--font-body);
    font-size: 13px; font-weight: 500;
    cursor: pointer;
  }

  .nav-links button:hover { color: var(--white); }

  /* ── Main ── */
  .main {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 24px 20px;
    padding-top: 15vh;
    gap: 16px;
  }

  /* ── Settings ── */
  .settings-panel {
    display: none;
    width: 100%; max-width: 480px;
    background: var(--navy);
    border: 1px solid var(--navy-light);
    border-radius: 4px;
    padding: 16px;
  }

  .settings-panel.open { display: block; }

  .settings-panel h3 {
    font-family: var(--font-display);
    font-size: 15px; margin-bottom: 12px;
  }

  .setting-group { margin-bottom: 12px; }

  .setting-group label {
    display: block; font-size: 13px;
    font-weight: 600; margin-bottom: 2px;
  }

  .setting-group small {
    display: block; font-size: 11px;
    color: var(--gray-mid); margin-bottom: 6px;
  }

  .setting-group input {
    width: 100%; padding: 8px 10px;
    border: 1px solid var(--navy-light);
    border-radius: 4px; font-size: 13px;
    font-family: var(--font-body);
    background: var(--navy-deep); color: var(--white);
  }

  .setting-group input:focus {
    outline: none; border-color: var(--teal);
  }

  .engine-toggle { display: flex; gap: 6px; margin-top: 6px; }

  .engine-btn {
    flex: 1; padding: 8px;
    border: 1px solid var(--navy-light);
    border-radius: 4px; background: var(--navy-deep);
    color: var(--gray-mid); font-size: 12px;
    font-weight: 600; font-family: var(--font-body);
    cursor: pointer; text-align: center;
  }

  .engine-btn.active {
    border-color: var(--teal);
    background: rgba(42,127,165,0.15);
    color: var(--teal);
  }

  /* ── Report Type Selector ── */
  .report-selector {
    margin: 16px 0 8px;
  }
  .report-selector-label {
    font-size: 11px; font-weight: 700; letter-spacing: 1.5px;
    text-transform: uppercase; color: var(--gray-mid); margin-bottom: 8px;
  }
  .report-toggle { display: flex; gap: 6px; }
  .report-btn {
    flex: 1; padding: 10px 8px;
    border: 1px solid var(--navy-light); border-radius: 6px;
    background: var(--navy-deep); cursor: pointer;
    text-align: center; display: flex; flex-direction: column;
    align-items: center; gap: 2px; transition: all 0.2s ease;
  }
  .report-btn strong {
    font-size: 12px; font-weight: 700; color: var(--gray-mid);
    font-family: var(--font-body);
  }
  .report-btn small {
    font-size: 10px; color: var(--gray-mid); opacity: 0.6;
    font-family: var(--font-body);
  }
  .report-btn.active {
    border-color: var(--teal);
    background: rgba(42,127,165,0.12);
  }
  .report-btn.active strong { color: var(--teal); }
  .report-btn.active small { color: var(--teal); opacity: 0.8; }
  .report-btn:hover { border-color: var(--teal); }

  /* ──────────────────────────────────────────────────────────
     Coaching Report — restrained typography
     Only weights used: 400 (regular) and 700 (bold).
     Italic = regular weight italic. No 500/600/800.
     Visual hierarchy carried by colored vertical sidebars:
       • Dimensions  — blue/teal
       • What's Working — green
       • Things to Work On — gold (orange)
       • Signatures — neutral navy-light
     ────────────────────────────────────────────────────────── */

  .coaching-report {
    color: var(--white);
    font-family: var(--font-body);
    font-weight: 400;
  }
  .coaching-report strong, .coaching-report b { font-weight: 700; }
  .coaching-report em, .coaching-report i { font-style: italic; font-weight: 400; }

  /* Speaker / Date header */
  .cr-speaker { text-align: center; margin-bottom: 14px; color: var(--gray-mid); }
  .cr-speaker .cr-name { font-size: 18px; font-weight: 700; color: var(--white); }
  .cr-speaker .cr-date { font-size: 13px; font-weight: 400; margin-top: 2px; }

  /* Synthesis paragraph (regular weight, not bold) */
  .synthesis-card {
    background: var(--navy);
    border-radius: 8px;
    padding: 16px 18px;
    border-left: 4px solid var(--teal);
    margin: 14px 0 18px;
    font-family: var(--font-display);
    font-weight: 400;
    font-size: 14px;
    line-height: 1.7;
    color: var(--offwhite);
  }
  .synthesis-card .overline {
    display: flex; align-items: center; justify-content: space-between;
    font-family: var(--font-body);
    font-weight: 700;
    font-size: 10px;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    color: var(--teal);
    margin-bottom: 10px;
  }

  /* Score circle + radar (kept; minor weight tidy) */
  .score-circle-wrap { text-align: center; margin: 18px 0; }
  .score-circle {
    width: 120px; height: 120px; border-radius: 50%;
    display: inline-flex; align-items: center; justify-content: center;
    flex-direction: column; border: 4px solid;
  }
  .score-circle .score-num { font-size: 36px; font-weight: 700; font-family: var(--font-display); }
  .score-circle .score-label { font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: 1px; opacity: 0.7; }
  .score-green { border-color: var(--green); color: var(--green); }
  .score-gold  { border-color: var(--gold);  color: var(--gold);  }
  .score-red   { border-color: var(--red);   color: var(--red);   }

  /* Section band labels (the heading above each band) */
  .cr-band-label {
    font-family: var(--font-body);
    font-weight: 700;
    font-size: 11px;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    margin: 22px 0 10px;
    display: flex; align-items: center; justify-content: space-between;
    padding-bottom: 4px;
    border-bottom: 1px solid var(--navy-light);
  }
  .cr-band-label.dimensions { color: var(--teal); }
  .cr-band-label.working    { color: var(--green); }
  .cr-band-label.work-todo  { color: var(--gold); }
  .cr-band-label.signatures { color: var(--gray-mid); }
  .cr-band-tier-label {
    font-family: var(--font-body);
    font-weight: 700;
    font-size: 10px;
    letter-spacing: 1.2px;
    text-transform: uppercase;
    color: var(--gray-mid);
    margin: 14px 0 6px;
  }

  /* ── Dimensions band — blue sidebar ── */
  .dim-card {
    background: var(--navy);
    border-radius: 8px;
    padding: 12px 14px;
    margin-bottom: 8px;
    border-left: 4px solid var(--teal);
  }
  .dim-card-head {
    display: flex; align-items: center; justify-content: space-between;
    gap: 10px; flex-wrap: wrap; margin-bottom: 6px;
  }
  .dim-card-name {
    font-size: 14px; font-weight: 700; color: var(--white); flex: 1;
  }
  .dim-card-dots { display: flex; gap: 4px; flex-shrink: 0; }
  .dim-dot {
    width: 12px; height: 12px; border-radius: 50%;
    border: 2px solid var(--teal); background: transparent;
  }
  .dim-dot.filled { background: var(--teal); }
  .dim-card-commentary {
    font-size: 13px; font-weight: 400;
    color: var(--offwhite); line-height: 1.55;
    margin-bottom: 8px;
  }
  .dim-card-evidence {
    font-style: italic; font-weight: 400;
    font-size: 12.5px; color: var(--offwhite);
    padding: 6px 10px;
    background: rgba(42,127,165,0.10);
    border-left: 2px solid var(--teal);
    border-radius: 0 4px 4px 0;
    line-height: 1.55;
  }

  /* Confidence badge */
  .conf-badge {
    display: inline-block;
    padding: 2px 6px;
    border-radius: 3px;
    font-size: 9px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    margin-left: 6px;
    vertical-align: middle;
  }
  .conf-high   { background: rgba(27,110,58,0.20);  color: var(--green); }
  .conf-medium { background: rgba(184,134,11,0.20); color: var(--gold);  }
  .conf-low    { background: rgba(176,39,29,0.20);  color: var(--red);   }

  /* ── What's Working band — green sidebar ── */
  .working-card {
    background: var(--navy);
    border-radius: 8px;
    padding: 12px 14px;
    margin-bottom: 8px;
    border-left: 4px solid var(--green);
  }
  .working-title {
    font-weight: 700;
    font-size: 14px;
    color: var(--white);
    margin-bottom: 6px;
  }
  .working-observation {
    font-weight: 400;
    font-size: 13px;
    color: var(--offwhite);
    line-height: 1.55;
    margin-bottom: 6px;
  }
  .working-quote {
    font-style: italic; font-weight: 400;
    font-size: 12.5px; color: var(--offwhite);
    padding: 6px 10px;
    background: rgba(27,110,58,0.10);
    border-left: 2px solid var(--green);
    border-radius: 0 4px 4px 0;
    line-height: 1.55;
  }

  /* ── Things to Work On band — orange/gold sidebar ── */
  .work-card {
    background: var(--navy);
    border-radius: 8px;
    padding: 12px 14px;
    margin-bottom: 10px;
    border-left: 4px solid var(--gold);
  }
  .work-card-head {
    display: flex; align-items: center;
    gap: 8px; margin-bottom: 10px;
    padding-bottom: 8px;
    border-bottom: 1px solid var(--navy-light);
  }
  .work-num {
    display: inline-block;
    width: 22px; height: 22px; line-height: 22px;
    text-align: center;
    background: var(--gold); color: var(--navy-deep);
    font-weight: 700; font-size: 11px;
    border-radius: 50%;
    flex-shrink: 0;
  }
  .work-title {
    font-weight: 700; font-size: 14px;
    color: var(--white); flex: 1;
  }
  .work-part { margin-bottom: 8px; }
  .work-part:last-child { margin-bottom: 0; }
  .work-part-label {
    font-weight: 700; font-size: 10px;
    letter-spacing: 1.2px; text-transform: uppercase;
    color: var(--gold); margin-bottom: 3px;
  }
  .work-part-text {
    font-weight: 400; font-size: 13px;
    color: var(--offwhite); line-height: 1.55;
  }
  .work-part.practicum .work-part-text {
    padding: 6px 10px;
    background: rgba(184,134,11,0.10);
    border-left: 2px solid var(--gold);
    border-radius: 0 4px 4px 0;
  }

  /* ── Signatures band — neutral sidebar ── */
  .sig-card {
    background: var(--navy);
    border-radius: 8px;
    padding: 12px 14px;
    margin-bottom: 8px;
    border-left: 4px solid var(--navy-light);
  }
  .sig-card.observed { border-left-color: var(--gray-mid); }
  .sig-card.not-observed { opacity: 0.85; }
  .sig-observation {
    font-weight: 400; font-size: 13px;
    color: var(--offwhite); line-height: 1.6;
    margin-bottom: 6px;
  }
  .sig-observation strong, .sig-observation b { font-weight: 700; }
  .sig-status-tag {
    display: inline-block;
    font-weight: 700; font-size: 10px;
    letter-spacing: 0.5px; text-transform: uppercase;
    padding: 2px 7px; border-radius: 10px;
    margin-left: 6px; vertical-align: middle;
  }
  .sig-status-tag.observed     { background: rgba(27,110,58,0.20); color: var(--green); }
  .sig-status-tag.not-observed { background: rgba(144,150,163,0.18); color: var(--gray-mid); }
  .sig-evidence {
    font-style: italic; font-weight: 400;
    font-size: 12.5px; color: var(--offwhite);
    padding: 6px 10px;
    background: rgba(144,150,163,0.08);
    border-left: 2px solid var(--gray-mid);
    border-radius: 0 4px 4px 0;
    line-height: 1.55;
  }

  /* ── Candidate Report Styles ── */
  .candidate-report { color: var(--white); }
  .exec-summary {
    background: var(--navy); border-radius: 8px; padding: 16px;
    border-left: 3px solid var(--teal); margin-bottom: 16px;
    font-size: 13px; line-height: 1.8;
  }
  .chart-pair { display: flex; gap: 16px; margin: 16px 0; flex-wrap: wrap; }
  .chart-box {
    flex: 1; min-width: 280px; background: var(--navy);
    border-radius: 8px; padding: 16px; text-align: center;
  }
  .chart-box h4 { font-size: 13px; font-weight: 700; margin-bottom: 10px; }
  .chart-box canvas { max-width: 100%; }

  .bar-section { margin-bottom: 16px; }
  .bar-section h4 {
    font-size: 11px; font-weight: 700; letter-spacing: 1.5px;
    text-transform: uppercase; margin-bottom: 10px;
    padding-bottom: 4px; border-bottom: 1px solid var(--navy-light);
  }
  .bar-row { margin-bottom: 10px; }
  .bar-row-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 3px; }
  .bar-label { font-size: 12px; font-weight: 600; }
  .bar-score { font-size: 12px; font-weight: 700; }
  .bar-track { height: 8px; background: var(--navy); border-radius: 4px; overflow: hidden; }
  .bar-fill { height: 100%; border-radius: 4px; transition: width 0.6s ease; }
  .bar-fill-blue { background: linear-gradient(90deg, var(--teal), #6bb3f0); }
  .bar-fill-gold { background: linear-gradient(90deg, var(--gold), #e8c96a); }
  .bar-desc { font-size: 11px; color: var(--gray-mid); margin-top: 3px; }
  .conf-badge {
    display: inline-block; padding: 1px 6px; border-radius: 3px;
    font-size: 9px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.5px;
    margin-left: 6px;
  }
  .conf-high { background: rgba(27,110,58,0.2); color: var(--green); }
  .conf-medium { background: rgba(184,134,11,0.2); color: var(--gold); }
  .conf-low { background: rgba(176,39,29,0.2); color: var(--red); }

  .fit-columns { display: flex; gap: 12px; margin: 12px 0; flex-wrap: wrap; }
  .fit-col {
    flex: 1; min-width: 250px; background: var(--navy);
    border-radius: 8px; padding: 14px;
  }
  .fit-col h4 { font-size: 13px; font-weight: 700; margin-bottom: 8px; }
  .fit-col.conservative { border-left: 3px solid var(--red); }
  .fit-col.progressive { border-left: 3px solid var(--gold); }
  .fit-item {
    font-size: 12px; color: var(--gray-mid); padding: 6px 0;
    border-bottom: 1px solid var(--navy-light);
  }
  .fit-item:last-child { border-bottom: none; }

  .signal-item {
    font-size: 12px; padding: 8px 12px; margin-bottom: 6px;
    background: rgba(42,127,165,0.08); border-left: 3px solid var(--teal);
    border-radius: 0 4px 4px 0;
  }
  .committee-q {
    font-size: 12px; padding: 8px 0;
    border-bottom: 1px solid var(--navy-light); line-height: 1.6;
  }
  .committee-q:last-child { border-bottom: none; }
  .committee-q strong { color: var(--teal); }

  /* ── Input Mode Tabs ── */
  .input-modes {
    display: flex; gap: 8px;
    margin: 16px 0; justify-content: center;
  }

  .mode-btn {
    padding: 10px 20px;
    border: 1px solid var(--navy-light);
    border-radius: 4px; background: var(--navy);
    color: var(--gray-mid); font-size: 13px;
    font-weight: 600; font-family: var(--font-body);
    cursor: pointer;
    transition: all 0.15s ease;
  }

  .mode-btn:hover { border-color: var(--teal); color: var(--white); }
  .mode-btn.active {
    border-color: var(--teal);
    background: var(--teal);
    color: var(--white);
  }

  /* ── Text / URL Input ── */
  .alt-input {
    display: none;
    width: 100%; max-width: 480px;
    margin-top: 12px;
  }

  .alt-input.visible { display: block; }

  .alt-input textarea {
    width: 100%; min-height: 120px;
    padding: 10px 12px;
    border: 1px solid var(--navy-light);
    border-radius: 4px; font-size: 13px;
    font-family: var(--font-body);
    background: var(--navy); color: var(--white);
    resize: vertical; line-height: 1.5;
  }

  .alt-input textarea:focus {
    outline: none; border-color: var(--teal);
  }

  .alt-input input {
    width: 100%;
    padding: 10px 12px;
    border: 1px solid var(--navy-light);
    border-radius: 4px; font-size: 13px;
    font-family: var(--font-body);
    background: var(--navy); color: var(--white);
  }

  .alt-input input:focus {
    outline: none; border-color: var(--teal);
  }

  .alt-input input[type="file"] { display: none; }
  .file-picker {
    display: block;
    width: 100%;
    padding: 10px 12px;
    border: 1px solid var(--navy-light);
    border-radius: 4px; font-size: 13px;
    font-family: var(--font-body);
    background: var(--navy); color: var(--gray-mid);
    cursor: pointer;
    transition: border-color 0.15s ease, color 0.15s ease;
  }
  .file-picker:hover { border-color: var(--teal); }
  .file-picker.has-file { color: var(--white); }

  .alt-input label {
    display: block; font-size: 12px;
    color: var(--gray-mid); margin-bottom: 6px;
  }

  .alt-input .analyze-btn {
    margin-top: 10px;
  }

  /* ── Analyze Button ── */
  .analyze-btn {
    padding: 12px 32px;
    background: var(--teal);
    color: var(--white);
    border: none; border-radius: 4px;
    font-size: 14px; font-weight: 700;
    font-family: var(--font-body);
    cursor: pointer;
    transition: background 0.2s ease;
  }

  .analyze-btn:hover { background: var(--navy); }
  .analyze-btn:disabled { opacity: 0.4; cursor: not-allowed; }

  /* ── Error ── */
  .error-msg {
    width: 100%; max-width: 480px;
    background: rgba(176,39,29,0.15);
    border: 1px solid var(--red);
    color: var(--red-light);
    padding: 8px 12px; border-radius: 4px;
    font-size: 13px; display: none;
  }

  .error-msg.visible { display: block; }

  /* ── Spinner ── */
  .spinner {
    display: none; text-align: center; padding: 16px;
  }

  .spinner.visible { display: block; }

  .spinner-ring {
    width: 36px; height: 36px;
    border: 3px solid var(--navy-light);
    border-top-color: var(--teal);
    border-radius: 50%;
    animation: spin 0.9s linear infinite;
    margin: 0 auto 10px;
  }

  @keyframes spin { to { transform: rotate(360deg); } }

  .spinner p { color: var(--gray-mid); font-size: 13px; }

  /* ── Results ── */
  .results {
    display: none;
    width: 100%; max-width: 640px;
  }

  .results.visible { display: block; }

  .results-header {
    display: flex; justify-content: space-between;
    align-items: center; margin-bottom: 12px;
  }

  .results-header h2 {
    font-family: var(--font-display);
    font-size: 20px; font-weight: 700;
  }

  .results-actions { display: flex; gap: 6px; }

  .btn-sm {
    padding: 6px 12px;
    border: 1px solid var(--navy-light);
    border-radius: 4px; background: var(--navy);
    color: var(--gray-mid); font-size: 12px;

<body>

    <div class="result-card navy-accent" id="pitchCard">
      <div class="overline">Introduction</div>
      <h3><span></span><button class="copy-btn" onclick="copySection(this, 'pitch')">Copy</button><button class="listen-btn" onclick="speakSection(this, 'pitch')">Listen</button></h3>

<script>
  // ── Worker URL — update after deploying to Cloudflare ──
  const WORKER_URL = 'https://sermon-summary-api.david-vanwinkle1.workers.dev';

  let state = {
    transcript: '',
    analysisData: null,
    saveDirHandle: null,
    mode: 'community', // 'community' or 'personal'
    reportType: 'summary' // 'summary', 'coaching', or 'candidate'
  };

  (function init() {
    state.mode = 'community';
    // Hide Listen buttons on iOS (all iOS browsers use Safari's limited speech engine)
    if (/iPad|iPhone|iPod/.test(navigator.userAgent)) {
      document.querySelectorAll('.listen-btn').forEach(b => b.style.display = 'none');
    }
    const wf = document.getElementById('waveform');
    for (let i = 0; i < 32; i++) {
      const b = document.createElement('div');
      b.className = 'waveform-bar';
      wf.appendChild(b);
    }
    // Restore saved folder handle
    openHandleDB().then(db => {
      const tx = db.transaction('handles', 'readonly');
      const req = tx.objectStore('handles').get('saveDir');
      req.onsuccess = () => {
        if (req.result) {
          state.saveDirHandle = req.result;
          document.getElementById('saveFolderName').textContent = req.result.name;
          updateSaveFolderDisplay(req.result.name);
        }
      };
    }).catch(() => {});
    // Share/Save button is always visible — uses Web Share API on mobile, folder save on desktop
  })();

  // Settings removed — all config is hardcoded. Ask Claude to change if needed.

  function selectReportType(type) {
    state.reportType = type;
    document.querySelectorAll('.report-btn').forEach(b => b.classList.remove('active'));
    document.getElementById('btn-' + type).classList.add('active');
  }

  async function analyzeSermon() {
    const t = state.transcript?.trim();
    if (!t || t.length < 50) { showError('Transcript is too short — paste more text or check the YouTube link.'); return; }

    document.getElementById('spinner').classList.add('visible');
    document.getElementById('results').classList.remove('visible');
    hideError();

    const reportType = state.reportType || 'summary';
    const prompt = getPromptForType(reportType, t);
    // Coaching's new schema (10 dims + 8 sigs + 3 focus + 4 tier sections + synthesis)
    // can exceed 7k tokens of output; give it the worker's cap.
    const maxTokens = (reportType === 'candidate' || reportType === 'coaching') ? 16000 : 8000;

    try {
      const apiPayload = { model: 'claude-sonnet-4-6', max_tokens: maxTokens, messages: [{ role: 'user', content: prompt }] };
      const r = await fetch(WORKER_URL + '/api/analyze', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(apiPayload)
      });
      if (!r.ok) {
        let errMsg = `API error: ${r.status}`;
        try { errMsg = (await r.json()).error?.message || errMsg; } catch {}
        throw new Error(errMsg);
      }

      // Read the response as either SSE stream (new worker) or JSON (legacy worker).
      // SSE keeps the connection alive past Cloudflare's 100s edge timeout.
      const ct = r.headers.get('Content-Type') || '';
      let text;
      let stopReason = null;
      if (ct.includes('text/event-stream')) {
        const reader = r.body.getReader();
        const decoder = new TextDecoder();
        let buf = '';
        text = '';
        while (true) {
          const { value, done } = await reader.read();
          if (done) break;
          buf += decoder.decode(value, { stream: true });
          let idx;
          while ((idx = buf.indexOf('\n\n')) !== -1) {
            const ev = buf.slice(0, idx);
            buf = buf.slice(idx + 2);
            if (!ev.trim()) continue;
            const dataLine = ev.split('\n').find(l => l.startsWith('data: '));
            if (!dataLine) continue;
            const data = dataLine.slice(6);
            if (data === '[DONE]') continue;
            let obj;
            try { obj = JSON.parse(data); } catch { continue; }
            if (obj.type === 'content_block_delta' && obj.delta?.type === 'text_delta') {
              text += obj.delta.text;
            } else if (obj.type === 'message_delta' && obj.delta?.stop_reason) {
              stopReason = obj.delta.stop_reason;
            } else if (obj.type === 'error') {
              throw new Error(obj.error?.message || 'Streaming error');
            }
          }
        }
      } else {
        const respJson = await r.json();
        text = respJson.content[0].text;
        stopReason = respJson.stop_reason || null;
      }

      // Truncation guard — surface a clear error before the JSON parse attempt
      if (stopReason === 'max_tokens') {
        throw new Error('Response was cut off mid-output (hit the token limit). Try a shorter sermon transcript, or contact support if this keeps happening.');
      }

      let analysis;
      try {
        analysis = JSON.parse(text);
      } catch (parseErr) {
        const m = text.match(/\{[\s\S]*\}/);
        if (m) {
          try { analysis = JSON.parse(m[0]); }
          catch { throw new Error('Claude returned malformed JSON (' + parseErr.message + '). The full response was received but could not be parsed.'); }
        } else {
          throw new Error('Could not parse results: ' + parseErr.message);
        }
      }
      state.analysisData = analysis;
      renderResults(analysis);
    } catch (err) {
      showError('Analysis failed: ' + err.message);
    } finally {
      document.getElementById('spinner').classList.remove('visible');
    }
  }

  function getPromptForType(type, transcript) {
    if (type === 'coaching') return getCoachingPrompt(transcript);
    if (type === 'candidate') return getCandidatePrompt(transcript);
    return getSummaryPrompt(transcript);
  }

  function getSummaryPrompt(t) {
    return `You are a skilled theologian and sermon analyst. Analyze the following sermon transcript and return a JSON object with exactly these keys:

1. "sermon_title": A concise 5-8 word title that captures the core purpose or theme of the sermon. Lead with the main idea, not a Bible reference.

2. "elevator_pitch": A compelling 1-2 sentence summary someone could use to tell a friend about this sermon.

3. "main_points": An array of objects, each with:
   - "title": A bold descriptive title
   - "explanation": A detailed 2-4 sentence explanation
   - "sub_points": (optional) An array of objects with "title" and "explanation"
   Include 4-6 main points.

4. "conclusions": An array of objects, each with "title" and "explanation" (2-3 sentences). Include 3-5 conclusions.

5. "key_quotes": An array of exactly 7 direct quotes capturing the arc of the entire message — opening to closing.

6. "group_study": An object with:
   - "intro_quote": The single most meaningful quote from the sermon
   - "intro_text": A warm 2-3 sentence introduction
   - "questions": An array of exactly 5 objects with "number" (1-5), "question", and "purpose" ("opener", "subpoint", or "closer"):
     * Q1 (opener): Welcoming, broad, easy to answer
     * Q2-4 (subpoint): Tied to specific main points, thought-provoking
     * Q5 (closer): Deeply reflective AND activating

7. "bible_verses": An array of 2-3 objects with "reference" and "relevance".

8. "application": An array of exactly 4 objects with "question" and "prompt":
   - Q1: How to live out this message
   - Q2: Who to tell about it
   - Q3: Verses to meditate on
   - Q4: A personal prayer prompt

Return ONLY valid JSON, no markdown, no code blocks.

SERMON TRANSCRIPT:
${t}`;
  }

  function getCoachingPrompt(t) {
    return `You are reading a sermon transcript as a thoughtful preaching coach in the voice of a seasoned pastor — honest about what is weak, generous about what is trying to be strong, slow to dismiss a move that may be faithful in a tradition not your own, and unwilling to hide behind vague affirmation. Read the sermon within its own tradition first. When a phrase could land two ways, read it in the more charitable direction. When the transcript does not give enough to score a dimension responsibly, lower confidence rather than raise certainty. Numbers do real work — be precise, and pair every score with evidence and plain prose.

Return ONLY valid JSON, no markdown, no code blocks, with these keys:

1. "sermon_title": A concise 5-8 word title capturing the sermon's theme.

2. "speaker_name": The full name of the speaker/preacher. Infer from the transcript. If uncertain, use "Unknown Speaker".

3. "sermon_date": Date the sermon was delivered (format: "Month Day, Year"). If not determinable, use "Date Unknown".

4. "overall_score": A single number 0-100 representing the weighted overall score. Compute as: sum over each dimension of (score × 20 × weight), where weights are:
   - Foundation tier (45%): Biblical Depth & Integrity 15%, Application Specificity 15%, Gospel Clarity 15%
   - Craft tier (30%): Structural Clarity 10%, Illustration Effectiveness 10%, Opening & Closing Power 10%
   - Connection tier (15%): Vulnerability & Authenticity 7.5%, Audience Engagement 7.5%
   - Style tier (10%): Contemporary Relevance 5%, Intellectual Depth 5%

5. "synthesis_paragraph": A 4-6 sentence plain-prose paragraph that opens the report. Before the numbers, what did you hear? What was the sermon trying to do, what did it do well, where did the weight sit, what should the preacher hold in mind as they look at the scores below? Pastoral, specific, anchored in the actual sermon. Not a list of compliments. Not a summary of points.

6. "dimensions": An array of exactly 10 objects, in this order — Biblical Depth & Integrity, Application Specificity, Gospel Clarity, Structural Clarity, Illustration Effectiveness, Opening & Closing Power, Vulnerability & Authenticity, Audience Engagement, Contemporary Relevance, Intellectual Depth — each with:
   - "name": Use the exact dimension name above
   - "tier": "Foundation" | "Craft" | "Connection" | "Style"
   - "score": Integer 1-5. 1=significant gaps. 2=attempted but inconsistent. 3=competent. 4=notably effective. 5=exceptional, worth studying.
   - "confidence": "High" | "Medium" | "Low" — based on how well the transcript evidences this dimension.
   - "commentary": 1-2 short sentences naming what you heard. Specific and concise. Examples of the right register: "Word study is brief but accurate." or "Sermon applies well across life stages — the 47.5-year-old reference is a nice touch." Avoid vague hedging.
   - "evidence": A direct quote from the transcript supporting the score. If truly unavailable, use "" and lower confidence.

7. "whats_working": An array of 4 to 5 objects naming the strongest moves the preacher made in this sermon. Sermon-wide affirmations drawn from across the dimensions. Genuine, not flattery; grounded in a quoted line. Each item has the same three-part anatomy as Things to Work On (title → observation → evidence) so a preacher can scan both sections with the same eye. Each:
   - "title": A short, repeatable label that anchors this affirmation to the rubric vocabulary. STRONGLY PREFER one of: (a) an exact dimension name (e.g., "Gospel Clarity", "Application Specificity"); (b) an exact signature name (e.g., "Christological Turn", "Aphoristic Compression"); or (c) a recurring craft-move label like "Closing Invitation", "Pastoral Vulnerability", "Word Study", "Personal Story". These titles are the anchor a preacher will carry from week to week — so reuse the same vocabulary across whats_working and things_to_work_on. Avoid one-off descriptive titles ("the sermon's middle section", "the part about marriage"). 1-3 words preferred; max 6.
   - "observation": 1-2 sentences naming what the move did in this sermon, why it landed. Specific and anchored. NOT a paraphrase of the title or quote. Example: "Christological turn is exegetically earned — the move from text to Christ comes out of the passage's own logic rather than being bolted on at the end."
   - "quote": Direct quote from the sermon that demonstrates it.

8. "things_to_work_on": An array of exactly 3 objects — the three highest-impact priorities for the preacher's next sermon-prep cycle. Same titling vocabulary as whats_working — so when a preacher works on "Closing Invitation" this week and it lands well next week, both reports show that same label. Each:
   - "title": Same constraint as whats_working — a dimension name, signature name, or recurring craft-move label. The title is the anchor across sessions. 1-3 words preferred; max 6. NEVER use geographic descriptions like "the sermon's middle section."
   - "observation": 1-2 sentences naming what the sermon is currently doing on this point. Specific, anchored in the sermon. Not a generalization.
   - "recommendation": 1-2 sentences on what to try instead. Where a paired signature applies, name it explicitly. Concrete, not aspirational.
   - "practicum": One specific small thing to do this week in sermon prep. Doable in normal study time. Not a vague intention.

9. "signatures": An array of exactly 8 objects, in this order — Christological Turn, Intertextual Anchoring, Word Study as Rhetorical Pivot, Cultural Longing in the Opening, Aphoristic Compression, Structural Return at Close, Mid-Stream Objection-Handling, Identity Framing in the Call — each with:
   - "name": Exact signature name
   - "paired_with": Array of dimension names this signature pairs with. Mapping: Christological Turn → ["Gospel Clarity"]; Intertextual Anchoring → ["Biblical Depth & Integrity"]; Word Study as Rhetorical Pivot → ["Biblical Depth & Integrity"]; Cultural Longing in the Opening → ["Opening & Closing Power"]; Aphoristic Compression → ["Illustration Effectiveness"]; Structural Return at Close → ["Opening & Closing Power"]; Mid-Stream Objection-Handling → ["Audience Engagement"]; Identity Framing in the Call → ["Vulnerability & Authenticity", "Audience Engagement"]
   - "observed": true if the sermon clearly made this craft move; false if it didn't. Either/or — no degrees. Read charitably; absence is not failure, just information.
   - "observation": 2-3 sentences. CRITICAL FORMATTING: weave a brief plain-language definition of the signature into the FIRST sentence so a reader who has never heard the term still understands what the move is. Then in the next sentence, state what was observed (or not observed) in this sermon. Examples of the right format —
       Aphoristic Compression observed: "Aphoristic compression — the discipline of shaping a single, portable sentence the listener can carry into the week — landed clearly here. The preacher condensed his thread about formation into one repeatable line that a parishioner could quote on Tuesday."
       Aphoristic Compression NOT observed: "Aphoristic compression — the discipline of shaping a single, portable sentence the listener can carry into the week — was not present in this sermon. The substance is clear, but no single line emerged for a listener to repeat."
       Christological Turn observed: "The Christological turn — the moment a sermon moves from the text in front of us to the One the text points toward — was made clearly. The closing pivots from the parable's logic to Christ as the One who fulfilled it."
   - "evidence": If observed, a direct quote from the sermon where the move lands. If not observed, use "".

Notes on producing the output:
- Affirmations and recommendations should be specific to THIS sermon, not generic preaching advice.
- Read charitably; absence of a signature is information, not failure — never penalize a dimension score for an absent signature.
- For dimensions without paired signatures (Application Specificity, Structural Clarity, Contemporary Relevance, Intellectual Depth), score them on their own terms.
- Keep all prose in the voice of a thoughtful pastor: warm, unpretentious, precise. Avoid hype, life-hack framing, easy certainty, and combative posture.

SERMON TRANSCRIPT:
${t}`;
  }

  function getCandidatePrompt(t) {
    return `You are an expert at evaluating pastoral candidates for church search committees. Analyze this sermon transcript using TWO rubrics — Teaching Style and Theological Fit. Return a JSON object with these keys:

1. "sermon_title": A concise 5-8 word title capturing the sermon's theme.

2. "speaker_name": The full name of the speaker/preacher. Infer from the transcript (introductions, references, self-mentions). If uncertain, use "Unknown Speaker".

3. "sermon_date": The date the sermon was delivered, if mentioned or inferable from the transcript (format: "Month Day, Year" e.g. "April 6, 2025"). If not determinable, use "Date Unknown".

4. "executive_summary": A 3-5 sentence narrative paragraph describing who this person is as a preacher — their style, strengths, theological positioning, and what kind of church they'd be the best fit for.

5. "teaching_style": An array of exactly 10 objects, each with:
   - "name": Use exactly these names: "Biblical Methodology", "Application Specificity", "Gospel Urgency", "Structural Approach", "Intellectual Complexity", "Illustration Density", "Vulnerability Level", "Interaction Style", "Contemporary Relevance", "Institutional Integration"
   - "tier": One of "Core Preaching", "Communication Craft", "Engagement & Style", "Institutional"
   - "score": Number 1-5 (these are TENDENCIES not quality: e.g., Structure 2 = organic/conversational, 5 = highly outlined)
   - "description": 2 sentences describing what was observed
   - "evidence": A direct quote or specific observation from the transcript

6. "theological_fit": An array of exactly 9 objects, each with:
   - "name": Use exactly these names: "Gender Roles", "Spiritual Gifts", "View of Scripture", "Salvation Emphasis", "Cultural Engagement", "Social Justice", "Political Signaling", "Leadership Style", "Ecclesiology"
   - "score": Number 1-5 (these are SPECTRA: Gender Roles 1=complementarian/5=egalitarian, Scripture 1=strict inerrancy/5=progressive hermeneutic, Salvation 1=decisional/5=process-oriented, Cultural Engagement 1=counter-cultural/5=culturally engaged, Social Justice 1=individual gospel/5=justice-embedded gospel, Political Signaling 1=conservative signals/5=progressive signals, Leadership 1=CEO-visionary/5=shepherd-relational, Ecclesiology 1=attractional/5=missional)
   - "confidence": "High", "Medium", or "Low" — based on how much evidence the transcript provided
   - "description": 2 sentences explaining the assessment
   - "evidence": A direct quote or observation supporting the score

7. "strengths": An array of 2-3 objects with:
   - "title": Strength area
   - "evidence": A direct quote demonstrating it
   - "significance": Why this matters for a church considering this candidate

8. "growth_areas": An array of 2-3 objects with:
   - "title": Area for development
   - "observation": What was noticed
   - "context": Why this matters (style difference vs. deficiency — be nuanced)

9. "fit_analysis": An object with:
   - "conservative_concerns": Array of 2-3 strings — signals that might concern more conservative/traditional churches
   - "progressive_concerns": Array of 2-3 strings — signals that might concern more progressive/mainline churches

10. "key_signals": An array of 3-5 strings — the most revealing moments/statements from the sermon that tell you who this person is

11. "committee_questions": An array of 5-7 recommended follow-up questions for the search committee to ask in an interview, based on areas where the transcript evidence was insufficient or ambiguous

Return ONLY valid JSON, no markdown, no code blocks. Be analytical and objective — this is an assessment tool for decision-makers, not a coaching report.

SERMON TRANSCRIPT:
${t}`;
  }

  function renderResults(d, skipSave) {
    const reportType = state.reportType || 'summary';
    const container = document.getElementById('results');

    // Show/hide summary-specific cards
    const summaryCards = ['pitchCard','summaryCard','conclusionsCard','quotesCard','studyCard','versesCard','applicationCard'];
    summaryCards.forEach(id => {
      const el = document.getElementById(id);
      if (el) el.style.display = reportType === 'summary' ? '' : 'none';
    });

    // Remove previous dynamic report
    const prev = container.querySelector('.coaching-report, .candidate-report');
    if (prev) prev.remove();

    document.getElementById('resultsTitle').textContent = d.sermon_title || 'Analysis';

    if (reportType === 'summary') {
      renderSummaryResults(d);
    } else if (reportType === 'coaching') {
      renderCoachingResults(d, container);
    } else if (reportType === 'candidate') {
      renderCandidateResults(d, container);
    }

    container.classList.add('visible');
    container.scrollIntoView({ behavior: 'smooth' });
    if (!skipSave) saveToHistory(d);

    // Pre-build share File after charts render (needs canvas to be drawn)
    // This must be ready BEFORE the user taps Share so navigator.share()
    // can fire synchronously in the click handler (Android gesture requirement)
    setTimeout(() => {
      try {
        const rt = state.reportType || 'summary';
        const slug = (d.sermon_title || 'sermon').toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/-+$/,'');
        const html = buildReportHTML(d, rt);
        const fname = `${slug}-${new Date().toISOString().slice(0,10)}.html`;
        const title = d.sermon_title || 'Sermon Analysis';
        state.shareFile = new File([html], fname, { type: 'application/octet-stream' });
        state.shareTitle = title;
        state.shareHTML = html;
      } catch(e) { console.warn('Share cache build failed', e); }
    }, 500);
  }

  function renderSummaryResults(d) {
    document.getElementById('pitchContent').textContent = d.elevator_pitch || '';

        }
        return html + '</div>';
      }).join('');
    } else {
      summaryHtml = '<ol>' + points.map(p => `<li>${esc(typeof p === 'string' ? p : p.title || '')}</li>`).join('') + '</ol>';
    }
    document.getElementById('summaryContent').innerHTML = summaryHtml;
    const conclusions = d.conclusions || [];
    let conclusionsHtml = '';
    if (conclusions.length && typeof conclusions[0] === 'object') {
      conclusionsHtml = conclusions.map(c => `<div class="summary-point"><div class="summary-point-title">${esc(c.title)}</div><div class="summary-point-text">${esc(c.explanation)}</div></div>`).join('');
    } else {
      conclusionsHtml = conclusions.map(c => `<p style="margin-bottom:8px">${esc(typeof c === 'string' ? c : '')}</p>`).join('');

    document.getElementById('quotesContent').innerHTML = (d.key_quotes || []).map((q, i) => `<div class="quote-item"><span class="quote-number">${i+1}.</span> "${esc(q)}"</div>`).join('');
    const study = d.group_study;
    if (study) {
      let studyHtml = '';
      if (study.intro_quote) studyHtml += `<div class="study-intro-quote">"${esc(study.intro_quote)}"</div>`;
      if (study.intro_text) studyHtml += `<div class="study-intro-text">${esc(study.intro_text)}</div>`;
      if (study.questions) {

    document.getElementById('applicationContent').innerHTML = (d.application || []).map((a, i) => `<div style="margin-bottom:14px;padding-bottom:14px;border-bottom:1px solid var(--navy-light)"><div style="font-weight:700;font-size:13px;color:var(--white);margin-bottom:4px"><span style="color:var(--teal)">${i+1}.</span> ${esc(a.question)}</div><div style="font-size:12px;line-height:1.5;color:var(--gray-mid);margin-left:16px;padding-left:12px;border-left:2px solid var(--navy-light)">${esc(a.prompt)}</div></div>`).join('');
  }

  // ── Coaching Report Renderer (four-band layout) ──
  // Top: speaker/date · synthesis paragraph (regular weight) · score circle + radar.
  // Then four bands, each a sermon-wide section with its own colored sidebar:
  //   1) Dimensions (blue)        — 10 cards: name + dots + confidence + commentary + evidence
  //   2) What's Working (green)   — 4-5 cards: title + quote
  //   3) Things to Work On (gold) — 3 cards: observation / recommendation / practicum
  //   4) Signatures (neutral)     — 8 cards: weave-in observation + evidence quote
  function renderCoachingResults(d, container) {
    const score = d.overall_score || 0;
    const scoreClass = score >= 75 ? 'score-green' : score >= 50 ? 'score-gold' : 'score-red';
    const dims = d.dimensions || [];
    const working = d.whats_working || [];
    const todo = d.things_to_work_on || [];
    const sigs = d.signatures || [];
    const tiers = ['Foundation', 'Craft', 'Connection', 'Style'];

    let html = '<div class="coaching-report">';

    // ── Speaker & Date header ──
    const speaker = d.speaker_name && d.speaker_name !== 'Unknown Speaker' ? d.speaker_name : '';
    const sDate = d.sermon_date && d.sermon_date !== 'Date Unknown' ? d.sermon_date : '';
    if (speaker || sDate) {
      html += `<div class="cr-speaker">`;
      if (speaker) html += `<div class="cr-name">${esc(speaker)}</div>`;
      if (sDate) html += `<div class="cr-date">${esc(sDate)}</div>`;
      html += `</div>`;
    }

    // ── Synthesis paragraph (regular weight, not bold) ──
    if (d.synthesis_paragraph) {
      html += `<div class="synthesis-card">
        <div class="overline">A Read of the Whole <button class="listen-btn" onclick="speakSection(this, 'coaching-synthesis')">Listen</button></div>
        ${esc(d.synthesis_paragraph)}
      </div>`;
    }

    // ── Overall Score + Radar ──
    html += `<div class="score-circle-wrap">
      <div class="score-circle ${scoreClass}">
        <div class="score-num">${score}</div>
        <div class="score-label">Overall</div>
      </div>
    </div>`;
    html += buildRadarSVG(dims);

    // ── BAND 1: Dimensions (blue sidebar), grouped by tier ──
    if (dims.length) {
      html += `<div class="cr-band-label dimensions">
        <span>Dimensions</span>
        <button class="listen-btn" onclick="speakSection(this, 'coaching-dimensions')">Listen</button>
      </div>`;
      tiers.forEach(tier => {
        const tierDims = dims.filter(dim => dim.tier === tier);
        if (!tierDims.length) return;
        html += `<div class="cr-band-tier-label">${esc(tier)}</div>`;
        tierDims.forEach(dim => {
          const conf = dim.confidence || '';
          const confClass = conf === 'High' ? 'conf-high' : conf === 'Medium' ? 'conf-medium' : conf === 'Low' ? 'conf-low' : '';
          html += `<div class="dim-card">
            <div class="dim-card-head">
              <div class="dim-card-name">${esc(dim.name)}${conf ? ` <span class="conf-badge ${confClass}">${esc(conf)}</span>` : ''}</div>
              <div class="dim-card-dots">`;
          for (let i = 1; i <= 5; i++) html += `<div class="dim-dot${i <= dim.score ? ' filled' : ''}"></div>`;
          html += `</div>
            </div>`;
          if (dim.commentary || dim.summary) {
            html += `<div class="dim-card-commentary">${esc(dim.commentary || dim.summary || '')}</div>`;
          }
          if (dim.evidence) {
            html += `<div class="dim-card-evidence">"${esc(dim.evidence)}"</div>`;
          }
          html += `</div>`;
        });
      });
    }

    // ── BAND 2: What's Working (green sidebar) — 4-5 sermon-wide affirmations ──
    // Anatomy: title (rubric-anchored) → observation → quote
    if (working.length) {
      html += `<div class="cr-band-label working">
        <span>What's Working</span>
        <button class="listen-btn" onclick="speakSection(this, 'coaching-working')">Listen</button>
      </div>`;
      working.forEach(w => {
        html += `<div class="working-card">
          <div class="working-title">${esc(w.title || '')}</div>`;
        if (w.observation) html += `<div class="working-observation">${esc(w.observation)}</div>`;
        if (w.quote) html += `<div class="working-quote">"${esc(w.quote)}"</div>`;
        html += `</div>`;
      });
    }

    // ── BAND 3: Things to Work On (gold sidebar) — 3 priorities ──
    // Anatomy: title (rubric-anchored) → observation → recommendation → practicum
    if (todo.length) {
      html += `<div class="cr-band-label work-todo">
        <span>Things to Work On</span>
        <button class="listen-btn" onclick="speakSection(this, 'coaching-work-todo')">Listen</button>
      </div>`;
      todo.forEach((item, i) => {
        html += `<div class="work-card">
          <div class="work-card-head">
            <span class="work-num">${i+1}</span>
            <span class="work-title">${esc(item.title || '')}</span>
          </div>
          <div class="work-part">
            <div class="work-part-label">Observation</div>
            <div class="work-part-text">${esc(item.observation || '')}</div>
          </div>
          <div class="work-part">
            <div class="work-part-label">Recommendation</div>
            <div class="work-part-text">${esc(item.recommendation || '')}</div>
          </div>
          <div class="work-part practicum">
            <div class="work-part-label">Practicum</div>
            <div class="work-part-text">${esc(item.practicum || '')}</div>
          </div>
        </div>`;
      });
    }

    // ── BAND 4: Signatures (neutral sidebar) — observation weaves in meaning, then evidence ──
    if (sigs.length) {
      html += `<div class="cr-band-label signatures">
        <span>Signatures</span>
        <button class="listen-btn" onclick="speakSection(this, 'coaching-signatures')">Listen</button>
      </div>`;
      sigs.forEach(sig => {
        const observed = sig.observed === true;
        html += `<div class="sig-card ${observed ? 'observed' : 'not-observed'}">
          <div class="sig-observation">${esc(sig.observation || '')}<span class="sig-status-tag ${observed ? 'observed' : 'not-observed'}">${observed ? 'Observed' : 'Not observed'}</span></div>`;
        if (observed && sig.evidence) {
          html += `<div class="sig-evidence">"${esc(sig.evidence)}"</div>`;
        }
        html += `</div>`;
      });
    }

    html += '</div>';
    container.querySelector('#applicationCard').insertAdjacentHTML('afterend', html);
  }

  function buildRadarSVG(dims) {
    const n = dims.length;
    if (n === 0) return '';
    const cx = 220, cy = 180, R = 110;
    let svg = `<div style="text-align:center;margin:16px 0"><svg width="100%" viewBox="0 0 440 360" style="max-width:440px">`;

    // Grid rings
    for (let ring = 1; ring <= 5; ring++) {
      const r = (ring / 5) * R;
      let pts = [];
      for (let i = 0; i < n; i++) {
        const angle = (2 * Math.PI * i / n) - Math.PI / 2;
        pts.push(`${cx + r * Math.cos(angle)},${cy + r * Math.sin(angle)}`);
      }
      svg += `<polygon points="${pts.join(' ')}" fill="none" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>`;
    }

    // Axis lines
    for (let i = 0; i < n; i++) {
      const angle = (2 * Math.PI * i / n) - Math.PI / 2;
      svg += `<line x1="${cx}" y1="${cy}" x2="${cx + R * Math.cos(angle)}" y2="${cy + R * Math.sin(angle)}" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>`;
    }

    // Data polygon
    let dataPts = [];
    for (let i = 0; i < n; i++) {
      const angle = (2 * Math.PI * i / n) - Math.PI / 2;
      const r = ((dims[i].score || 0) / 5) * R;
      dataPts.push(`${cx + r * Math.cos(angle)},${cy + r * Math.sin(angle)}`);
    }
    svg += `<polygon points="${dataPts.join(' ')}" fill="rgba(42,127,165,0.2)" stroke="rgba(42,127,165,0.8)" stroke-width="2"/>`;

    // Data points
    for (let i = 0; i < n; i++) {
      const angle = (2 * Math.PI * i / n) - Math.PI / 2;
      const r = ((dims[i].score || 0) / 5) * R;
      svg += `<circle cx="${cx + r * Math.cos(angle)}" cy="${cy + r * Math.sin(angle)}" r="3" fill="#2A7FA5"/>`;
    }

    // Labels
    for (let i = 0; i < n; i++) {
      const angle = (2 * Math.PI * i / n) - Math.PI / 2;
      const lx = cx + (R + 22) * Math.cos(angle);
      const ly = cy + (R + 22) * Math.sin(angle);
      const anchor = Math.abs(Math.cos(angle)) < 0.1 ? 'middle' : Math.cos(angle) > 0 ? 'start' : 'end';
      // Shorten long names
      const shortName = dims[i].name.replace('& Integrity','').replace('& Authenticity','').replace('Effectiveness','').replace('Specificity','').trim();
      svg += `<text x="${lx}" y="${ly}" text-anchor="${anchor}" dominant-baseline="middle" fill="rgba(255,255,255,0.7)" font-size="8" font-family="var(--font-body)">${esc(shortName)}</text>`;
    }

    svg += '</svg></div>';
    return svg;
  }

  // ── Candidate Report Renderer ──
  async function renderCandidateResults(d, container) {
    const teaching = d.teaching_style || [];
    const theology = d.theological_fit || [];

    let html = '<div class="candidate-report">';

    // Speaker & Date header
    const speaker = d.speaker_name && d.speaker_name !== 'Unknown Speaker' ? d.speaker_name : '';

    if (speaker || sDate) {
      html += `<div style="text-align:center;margin-bottom:16px;color:var(--gray-mid)">`;
      if (speaker) html += `<div style="font-size:18px;font-weight:700;color:var(--text)">${esc(speaker)}</div>`;

    // Teaching Style Detail
    html += '<div class="bar-section"><h4 style="color:var(--teal)">Teaching Style Profile <button class="listen-btn" onclick="speakSection(this, \'candidate-teaching\')">Listen</button></h4>';
    const teachingTiers = { 'Core Preaching': [], 'Communication Craft': [], 'Engagement & Style': [], 'Institutional': [] };
    teaching.forEach(t => { if (teachingTiers[t.tier]) teachingTiers[t.tier].push(t); else teachingTiers['Core Preaching'].push(t); });
    Object.entries(teachingTiers).forEach(([tier, items]) => {

    });
    html += '</div>';

    // Theological Fit Detail
    html += '<div class="bar-section"><h4 style="color:var(--gold)">Theological Fit Profile <button class="listen-btn" onclick="speakSection(this, \'candidate-theology\')">Listen</button></h4>';
    theology.forEach(t => {
      const pct = (t.score / 5) * 100;
      const confClass = t.confidence === 'High' ? 'conf-high' : t.confidence === 'Medium' ? 'conf-medium' : 'conf-low';
      html += `<div class="bar-row">
        <div class="bar-row-top">
          <span class="bar-label">${esc(t.name)} <span class="conf-badge ${confClass}">${esc(t.confidence || 'Low')}</span></span>
          <span class="bar-score">${t.score}/5</span>
        </div>
        <div class="bar-track"><div class="bar-fill bar-fill-gold" style="width:${pct}%"></div></div>
        <div class="bar-desc">${esc(t.description || '')}</div>
      </div>`;
    });
    html += '</div>';

    // Strengths
    if (d.strengths && d.strengths.length) {
      html += '<div class="bar-section"><h4 style="color:var(--green)">Strengths <button class="listen-btn" onclick="speakSection(this, \'candidate-strengths\')">Listen</button></h4>';
      d.strengths.forEach(s => {
        html += `<div class="coaching-card strength"><h4>${esc(s.title)}</h4>`;
        if (s.evidence) html += `<div class="evidence-quote">"${esc(s.evidence)}"</div>`;
        if (s.significance) html += `<p style="margin-top:6px">${esc(s.significance)}</p>`;
        html += '</div>';
      });
      html += '</div>';
    }

    // Growth Areas
    if (d.growth_areas && d.growth_areas.length) {
      html += '<div class="bar-section"><h4 style="color:var(--gold)">Growth Areas <button class="listen-btn" onclick="speakSection(this, \'candidate-growth\')">Listen</button></h4>';
      d.growth_areas.forEach(g => {
        html += `<div class="coaching-card improvement"><h4>${esc(g.title)}</h4>`;
        if (g.observation) html += `<p>${esc(g.observation)}</p>`;
        if (g.context) html += `<p style="font-style:italic">${esc(g.context)}</p>`;
        html += '</div>';
      });
      html += '</div>';
    }

    // Fit Analysis
    if (d.fit_analysis) {
      html += '<div class="bar-section"><h4>Fit Analysis <button class="listen-btn" onclick="speakSection(this, \'candidate-fit\')">Listen</button></h4><div class="fit-columns">';
      html += '<div class="fit-col conservative"><h4 style="color:var(--red)">⚠ Potential Concerns for Conservative Churches</h4>';
      (d.fit_analysis.conservative_concerns || []).forEach(c => html += `<div class="fit-item">${esc(c)}</div>`);
      html += '</div>';
      html += '<div class="fit-col progressive"><h4 style="color:var(--gold)">⚠ Potential Concerns for Progressive Churches</h4>';
      (d.fit_analysis.progressive_concerns || []).forEach(c => html += `<div class="fit-item">${esc(c)}</div>`);
      html += '</div></div></div>';
    }

    // Key Signals
    if (d.key_signals && d.key_signals.length) {
      html += '<div class="bar-section"><h4 style="color:var(--teal)">Key Signals <button class="listen-btn" onclick="speakSection(this, \'candidate-signals\')">Listen</button></h4>';
      d.key_signals.forEach(s => html += `<div class="signal-item">${esc(s)}</div>`);
      html += '</div>';
    }

    // Committee Questions
    if (d.committee_questions && d.committee_questions.length) {
      html += '<div class="bar-section"><h4>Recommended Follow-Up Questions <button class="listen-btn" onclick="speakSection(this, \'candidate-questions\')">Listen</button></h4>';
      d.committee_questions.forEach((q, i) => html += `<div class="committee-q"><strong>${i+1}.</strong> ${esc(q)}</div>`);
      html += '</div>';
    }

    html += '</div>';
    container.querySelector('#applicationCard').insertAdjacentHTML('afterend', html);

    // Load Chart.js and render radars
    await loadChartJs();
    renderCandidateRadars(teaching, theology);
  }

  function loadChartJs() {
    return new Promise((resolve, reject) => {
      if (window.Chart) return resolve();
      const s = document.createElement('script');
      s.src = 'https://cdn.jsdelivr.net/npm/chart.js';
      s.onload = resolve;
      s.onerror = () => resolve(); // degrade gracefully
      document.head.appendChild(s);
    });
  }

  function renderCandidateRadars(teaching, theology) {

        plugins: { legend: { display: false } }
      }
    });

    // Teaching Style radar
    const ctx1 = document.getElementById('candidateRadar1');

      new Chart(ctx1, {

          datasets: [{ data: teaching.map(t => t.score), backgroundColor: 'rgba(42,127,165,0.15)', borderColor: 'rgba(42,127,165,0.8)', borderWidth: 2, pointBackgroundColor: '#2A7FA5', pointRadius: 3 }]
        },
        options: { responsive: true, scales: { r: { min: 0, max: 5, ticks: { stepSize: 1, color: 'rgba(255,255,255,0.4)', backdropColor: 'transparent' }, grid: { color: 'rgba(255,255,255,0.1)' }, pointLabels: { color: 'rgba(255,255,255,0.7)', font: { size: 9 } } } }, plugins: { legend: { display: false } } }

    // Theological Fit radar
    const ctx2 = document.getElementById('candidateRadar2');
    if (ctx2) {
      new Chart(ctx2, {
        type: 'radar',
        data: {
          labels: theology.map(t => t.name.length > 16 ? t.name.substring(0,14) + '…' : t.name),
          datasets: [{ data: theology.map(t => t.score), backgroundColor: 'rgba(184,134,11,0.15)', borderColor: 'rgba(184,134,11,0.8)', borderWidth: 2, pointBackgroundColor: '#B8860B', pointRadius: 3 }]
        },
        options: { responsive: true, scales: { r: { min: 0, max: 5, ticks: { stepSize: 1, color: 'rgba(255,255,255,0.4)', backdropColor: 'transparent' }, grid: { color: 'rgba(255,255,255,0.1)' }, pointLabels: { color: 'rgba(255,255,255,0.7)', font: { size: 9 } } } }, plugins: { legend: { display: false } } }
      });

  }

  function esc(s) { const d = document.createElement('div'); d.textContent = s; return d.innerHTML; }

  function copySection(btn, section) {
    if (!state.analysisData) return;
    const d = state.analysisData;
    let text = '';
    switch (section) {
      case 'pitch': text = d.elevator_pitch; break;
      case 'summary': text = 'MAIN POINTS\n' + (d.main_points||[]).map((p,i) => {
        if (typeof p === 'object') {
          let t = `${i+1}. ${p.title}: ${p.explanation}`;
          if (p.sub_points) t += '\n' + p.sub_points.map(sp => `   - ${sp.title}: ${sp.explanation}`).join('\n');
          return t;
        }
        return `${i+1}. ${p}`;
      }).join('\n\n'); break;
      case 'conclusions': text = 'CONCLUSIONS\n' + (d.conclusions||[]).map((c,i) => typeof c === 'object' ? `${i+1}. ${c.title}: ${c.explanation}` : `${i+1}. ${c}`).join('\n\n'); break;
      case 'quotes': text = '7 KEY QUOTES\n' + (d.key_quotes||[]).map((q,i) => `${i+1}. "${q}"`).join('\n'); break;
      case 'study': {
        const s = d.group_study;
        if (s) {
          text = 'GROUP STUDY GUIDE\n\n';
          if (s.intro_quote) text += `"${s.intro_quote}"\n\n`;
          if (s.intro_text) text += s.intro_text + '\n\n';
          if (s.questions) text += s.questions.map(q => `Q${q.number}. ${q.question}`).join('\n\n');
        }
      } break;
      case 'verses': text = 'SCRIPTURE\n' + (d.bible_verses||[]).map(v => `${v.reference} — ${v.relevance}`).join('\n\n'); break;
      case 'application': text = 'APPLICATION\n' + (d.application||[]).map((a,i) => `${i+1}. ${a.question}\n   ${a.prompt}`).join('\n\n'); break;
    }
    navigator.clipboard.writeText(text).then(() => {
      btn.textContent = 'Copied'; btn.classList.add('copied');
      setTimeout(() => { btn.textContent = 'Copy'; btn.classList.remove('copied'); }, 2000);
    });
  }

  let currentSpeechBtn = null;

  function stopSpeech() {
    speechSynthesis.cancel();
    document.querySelectorAll('.listen-btn.speaking').forEach(b => {
      b.textContent = 'Listen'; b.classList.remove('speaking');
    });
    currentSpeechBtn = null;
  }

  function speakSection(btn, section) {
    const wasSpeaking = btn.classList.contains('speaking');
    // Always stop any current speech first
    stopSpeech();
    if (wasSpeaking) return;

    if (!state.analysisData) return;
    const d = state.analysisData;
    let text = '';
    switch (section) {
      case 'pitch': text = d.elevator_pitch; break;
      case 'summary': text = (d.main_points||[]).map((p,i) => {
        if (typeof p === 'object') {
          let t = `Point ${i+1}. ${p.title}. ${p.explanation}`;
          if (p.sub_points) t += ' ' + p.sub_points.map(sp => `${sp.title}. ${sp.explanation}`).join(' ');
          return t;
        }
        return p;
      }).join('. '); break;
      case 'conclusions': text = (d.conclusions||[]).map((c,i) => typeof c === 'object' ? `${c.title}. ${c.explanation}` : c).join('. '); break;
      case 'quotes': text = (d.key_quotes||[]).map((q,i) => `Quote ${i+1}. ${q}`).join('. '); break;
      case 'study': {
        const s = d.group_study;
        if (s) {
          text = '';
          if (s.intro_quote) text += s.intro_quote + '. ';
          if (s.intro_text) text += s.intro_text + ' ';
          if (s.questions) text += s.questions.map(q => `Question ${q.number}. ${q.question}`).join('. ');
        }
      } break;
      case 'verses': text = (d.bible_verses||[]).map(v => `${v.reference}. ${v.relevance}`).join('. '); break;
      case 'application': text = (d.application||[]).map((a,i) => `${i+1}. ${a.question}. ${a.prompt}`).join('. '); break;
      // Coaching sections
      case 'coaching-synthesis': text = d.synthesis_paragraph || ''; break;
      case 'coaching-dimensions': text = (d.dimensions||[]).map(dim => `${dim.name}. Score ${dim.score} of 5${dim.confidence ? ', ' + dim.confidence + ' confidence' : ''}. ${dim.commentary || dim.summary || ''}${dim.evidence ? ' Quote: ' + dim.evidence : ''}`).join('. '); break;
      case 'coaching-working': text = (d.whats_working||[]).map((w,i) => `${i+1}. ${w.title || ''}.${w.observation ? ' ' + w.observation : ''}${w.quote ? ' Quote: ' + w.quote : ''}`).join(' '); break;
      case 'coaching-work-todo': text = (d.things_to_work_on||[]).map((item,i) => `Priority ${i+1}. ${item.title || ''}. Observation: ${item.observation || ''}. Recommendation: ${item.recommendation || ''}. Practicum: ${item.practicum || ''}`).join(' '); break;
      case 'coaching-signatures': text = (d.signatures||[]).map(sig => `${sig.observation || sig.name || ''}${sig.observed && sig.evidence ? ' Quote: ' + sig.evidence : ''}`).join(' '); break;
      // Candidate sections
      case 'candidate-summary': text = d.executive_summary || ''; break;
      case 'candidate-teaching': text = (d.teaching_style||[]).map(t => `${t.name}. Score ${t.score} out of 5. ${t.description}`).join('. '); break;
      case 'candidate-theology': text = (d.theological_fit||[]).map(t => `${t.name}. Score ${t.score} out of 5. Confidence: ${t.confidence}. ${t.description}`).join('. '); break;
      case 'candidate-strengths': text = (d.strengths||[]).map(s => `${s.title}. ${s.evidence || ''}. ${s.significance || ''}`).join('. '); break;
      case 'candidate-growth': text = (d.growth_areas||[]).map(g => `${g.title}. ${g.observation || ''}. ${g.context || ''}`).join('. '); break;
      case 'candidate-fit': {
        const fa = d.fit_analysis || {};
        text = 'Conservative concerns: ' + (fa.conservative_concerns||[]).join('. ') + '. Progressive concerns: ' + (fa.progressive_concerns||[]).join('. ');
      } break;
      case 'candidate-signals': text = (d.key_signals||[]).map((s,i) => `Signal ${i+1}. ${s}`).join('. '); break;
      case 'candidate-questions': text = (d.committee_questions||[]).map((q,i) => `Question ${i+1}. ${q}`).join('. '); break;
    }
    if (!text) return;

    // Split long text into chunks under 200 chars (mobile Chrome limit)
    const sentences = text.match(/[^.!?]+[.!?]+/g) || [text];
    const chunks = [];
    let current = '';
    for (const s of sentences) {
      if ((current + s).length > 200 && current) { chunks.push(current); current = ''; }
      current += s;
    }
    if (current) chunks.push(current);

    currentSpeechBtn = btn;
    btn.textContent = 'Stop'; btn.classList.add('speaking');

    let i = 0;
    function speakNext() {
      if (i >= chunks.length || currentSpeechBtn !== btn) {
        btn.textContent = 'Listen'; btn.classList.remove('speaking');
        currentSpeechBtn = null;
        return;
      }
      const utter = new SpeechSynthesisUtterance(chunks[i]);
      utter.rate = 0.95;
      utter.onend = () => { i++; speakNext(); };
      utter.onerror = () => { btn.textContent = 'Listen'; btn.classList.remove('speaking'); currentSpeechBtn = null; };
      speechSynthesis.speak(utter);
    }
    speakNext();
  }

  function copyAll() {
    if (!state.analysisData) return;
    navigator.clipboard.writeText(buildResultsText(state.analysisData));
  }

  function buildResultsText(d) {
    const type = state.reportType || 'summary';
    if (type === 'coaching') return buildCoachingText(d);
    if (type === 'candidate') return buildCandidateText(d);
    return buildSummaryText(d);
  }

  function buildSummaryText(d) {
    const pts = (d.main_points||[]).map((p,i) => {
      if (typeof p === 'object') {
        let t = `${i+1}. ${p.title}: ${p.explanation}`;
        if (p.sub_points) t += '\n' + p.sub_points.map(sp => `   - ${sp.title}: ${sp.explanation}`).join('\n');
        return t;
      }
      return `${i+1}. ${p}`;
    });
    const concl = (d.conclusions||[]).map((c,i) => typeof c === 'object' ? `${i+1}. ${c.title}: ${c.explanation}` : `${i+1}. ${c}`);
    const study = [];
    if (d.group_study) {
      study.push('GROUP STUDY GUIDE', '');
      if (d.group_study.intro_quote) study.push(`"${d.group_study.intro_quote}"`, '');
      if (d.group_study.intro_text) study.push(d.group_study.intro_text, '');
      if (d.group_study.questions) study.push(...d.group_study.questions.map(q => `Q${q.number}. ${q.question}`));
    }
    const title = d.sermon_title ? [d.sermon_title, ''] : [];
    return [...title, 'SERMON ANALYSIS','='.repeat(40),'','INTRODUCTION',d.elevator_pitch,'',
      'MAIN POINTS',...pts,'',
      'CONCLUSIONS',...concl,'',
      '7 KEY QUOTES',...(d.key_quotes||[]).map((q,i)=>`${i+1}. "${q}"`),'',
      ...study,'',
      'SCRIPTURE',...(d.bible_verses||[]).map(v=>`${v.reference}\n${v.relevance}`),'',
      'APPLICATION',...(d.application||[]).map((a,i)=>`${i+1}. ${a.question}\n   ${a.prompt}`)].join('\n');
  }

  function buildCoachingText(d) {
    const lines = [d.sermon_title || 'Sermon'];
    if (d.speaker_name) lines.push(`Speaker: ${d.speaker_name}`);
    if (d.sermon_date) lines.push(`Date: ${d.sermon_date}`);
    lines.push('', 'SERMONCOACH REPORT', '='.repeat(40), '');

    if (d.synthesis_paragraph) {
      lines.push('A READ OF THE WHOLE', d.synthesis_paragraph, '');
    }

    lines.push(`OVERALL SCORE: ${d.overall_score || 0}/100`, '');

    // ── BAND 1: Dimensions (grouped by tier) ──
    lines.push('DIMENSIONS', '-'.repeat(40));
    const tiers = ['Foundation', 'Craft', 'Connection', 'Style'];
    tiers.forEach(tier => {
      const dims = (d.dimensions || []).filter(dim => dim.tier === tier);
      if (!dims.length) return;
      lines.push(tier);
      dims.forEach(dim => {
        const conf = dim.confidence ? ` [${dim.confidence}]` : '';
        lines.push(`  ${dim.name}: ${dim.score}/5${conf}`);
        if (dim.commentary || dim.summary) lines.push(`    ${dim.commentary || dim.summary}`);
        if (dim.evidence) lines.push(`    "${dim.evidence}"`);
      });
      lines.push('');
    });

    // ── BAND 2: What's Working ──
    if ((d.whats_working || []).length) {
      lines.push("WHAT'S WORKING", '-'.repeat(40));
      d.whats_working.forEach(w => {
        lines.push(`• ${w.title || ''}`);
        if (w.observation) lines.push(`  ${w.observation}`);
        if (w.quote)       lines.push(`  "${w.quote}"`);
        lines.push('');
      });
    }

    // ── BAND 3: Things to Work On ──
    if ((d.things_to_work_on || []).length) {
      lines.push('THINGS TO WORK ON', '-'.repeat(40));
      d.things_to_work_on.forEach((item, i) => {
        lines.push(`${i+1}. ${item.title || ''}`);
        if (item.observation)    lines.push(`   Observation:    ${item.observation}`);
        if (item.recommendation) lines.push(`   Recommendation: ${item.recommendation}`);
        if (item.practicum)      lines.push(`   Practicum:      ${item.practicum}`);
        lines.push('');
      });
    }

    // ── BAND 4: Signatures ──
    if ((d.signatures || []).length) {
      lines.push('SIGNATURES', '-'.repeat(40));
      d.signatures.forEach(sig => {
        const mark = sig.observed ? '[OBSERVED]' : '[NOT OBSERVED]';
        lines.push(`${mark} ${sig.observation || sig.name || ''}`);
        if (sig.observed && sig.evidence) lines.push(`  "${sig.evidence}"`);
        lines.push('');
      });
    }

    return lines.join('\n');
  }

  function buildCandidateText(d) {
    const lines = [d.sermon_title || 'Sermon'];
    if (d.speaker_name) lines.push(`Speaker: ${d.speaker_name}`);
    if (d.sermon_date) lines.push(`Date: ${d.sermon_date}`);
    lines.push('', 'PASTORAL SEARCH REPORT', '='.repeat(40), '',
      'EXECUTIVE SUMMARY', d.executive_summary || '', '');
    lines.push('TEACHING STYLE');
    (d.teaching_style || []).forEach(t => lines.push(`  ${t.name}: ${t.score}/5 — ${t.description}`));
    lines.push('', 'THEOLOGICAL FIT');
    (d.theological_fit || []).forEach(t => lines.push(`  ${t.name}: ${t.score}/5 [${t.confidence}] — ${t.description}`));
    lines.push('', 'STRENGTHS');
    (d.strengths || []).forEach(s => lines.push(`• ${s.title}`, s.evidence ? `  "${s.evidence}"` : '', ''));
    lines.push('GROWTH AREAS');
    (d.growth_areas || []).forEach(g => lines.push(`• ${g.title}: ${g.observation}`, ''));
    if (d.fit_analysis) {
      lines.push('FIT ANALYSIS', 'Conservative concerns:');
      (d.fit_analysis.conservative_concerns || []).forEach(c => lines.push(`  • ${c}`));
      lines.push('Progressive concerns:');
      (d.fit_analysis.progressive_concerns || []).forEach(c => lines.push(`  • ${c}`));
      lines.push('');
    }
    lines.push('KEY SIGNALS');
    (d.key_signals || []).forEach(s => lines.push(`• ${s}`));
    lines.push('', 'FOLLOW-UP QUESTIONS');
    (d.committee_questions || []).forEach((q, i) => lines.push(`${i+1}. ${q}`));
    return lines.join('\n');
  }

  async function saveResults() {
    if (!state.analysisData) return;

    // If no folder selected yet, prompt for one
    if (!state.saveDirHandle) {
      if (window.showDirectoryPicker) {
        await pickSaveFolder();
        if (!state.saveDirHandle) return; // user cancelled
      }
      // If browser doesn't support folder picker, fall through to browser download
    }

    const d = state.analysisData;
    const reportType = state.reportType || 'summary';
    const titleSlug = (d.sermon_title || 'sermon').toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/-+$/,'');

    let content, filename;
    if (reportType === 'summary') {
      content = buildResultsText(d);
      filename = `${titleSlug}-${new Date().toISOString().slice(0,10)}.txt`;
    } else {
      content = buildReportHTML(d, reportType);
      filename = `${titleSlug}-${new Date().toISOString().slice(0,10)}.html`;
    }

    if (state.saveDirHandle) {
      await saveToFolder(state.saveDirHandle, filename, content);
      showSaveConfirmation(filename);
    } else {
      // Fallback for browsers without folder picker
      const mimeType = reportType === 'summary' ? 'text/plain' : 'text/html';
      const a = document.createElement('a');
      a.href = URL.createObjectURL(new Blob([content], { type: mimeType }));
      a.download = filename;
      a.click();
    }
  }

  function updateSaveFolderDisplay(folderName) {
    const el = document.getElementById('saveFolderDisplay');
    if (el) {
      el.innerHTML = folderName ? `📁 ${esc(folderName)} <span style="opacity:0.5;font-size:9px">(change)</span>` : '';
    }
  }

  function showSaveConfirmation(msg) {
    const el = document.getElementById('resultsActions');
    if (!el) return;
    const toast = document.createElement('div');
    toast.textContent = '✅ ' + (msg || 'Saved!');
    toast.style.cssText = 'position:fixed;bottom:80px;left:50%;transform:translateX(-50%);background:var(--green);color:#fff;padding:8px 20px;border-radius:20px;font-size:14px;font-weight:600;z-index:9999;box-shadow:0 2px 8px rgba(0,0,0,.2)';
    document.body.appendChild(toast);
    setTimeout(() => toast.remove(), 2500);
  }

  function buildReportHTML(d, reportType) {
    const title = d.sermon_title || 'Sermon Analysis';
    const speaker = d.speaker_name || '';
    const sDate = d.sermon_date || '';
    const reportLabels = { summary: 'Sermon Summary', coaching: 'Coaching Report', candidate: 'Pastoral Search Report' };
    const reportLabel = reportLabels[reportType] || 'Sermon Analysis';

    // Grab the rendered report HTML from the DOM
    let reportContent = '';
    if (reportType === 'summary') {
      // Capture summary cards
      const cardIds = ['pitchCard','summaryCard','conclusionsCard','quotesCard','studyCard','versesCard','applicationCard'];
      const cards = cardIds.map(id => document.getElementById(id)).filter(el => el && el.style.display !== 'none');
      reportContent = '<div class="summary-report">' + cards.map(c => {
        const clone = c.cloneNode(true);
        // Remove Copy/Listen buttons from export
        clone.querySelectorAll('.copy-btn, .listen-btn').forEach(b => b.remove());
        return clone.outerHTML;
      }).join('') + '</div>';
    } else {
      const reportEl = document.querySelector('.coaching-report, .candidate-report');
      if (reportEl) {
        const clone = reportEl.cloneNode(true);
        // Convert canvas elements to inline images
        const origCanvases = reportEl.querySelectorAll('canvas');
        const cloneCanvases = clone.querySelectorAll('canvas');

    }

<body>
  <div class="report-header">
    <div class="report-label">${esc(reportLabel)}</div>
    <h1>${esc(title)}</h1>
    ${speaker && speaker !== 'Unknown Speaker' ? `<div class="speaker">${esc(speaker)}</div>` : ''}
    ${sDate && sDate !== 'Date Unknown' ? `<div class="date">${esc(sDate)}</div>` : ''}
  </div>
  ${reportContent}
  <div class="report-footer">Generated by SERMONcoach &bull; ShowEm.ai &bull; ${new Date().toLocaleDateString('en-US', { month: 'long', day: 'numeric', year: 'numeric' })}</div>
