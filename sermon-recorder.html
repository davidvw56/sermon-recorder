  }

  // Save: share text file via share sheet (OneDrive, etc.) or folder picker on desktop
  function saveReport() {
    if (!state.analysisData) return;
    var d = state.analysisData;
    var text = buildResultsText(d);
    var slug = (d.sermon_title || 'sermon').toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/-+$/,'');
    var filename = slug + '-' + new Date().toISOString().slice(0,10) + '.txt';
    var title = d.sermon_title || 'Sermon Analysis';

    // Use share sheet — OneDrive, Google Drive, etc. appear as save targets
    var file = new File([text], filename, { type: 'text/plain' });
    if (navigator.canShare && navigator.canShare({ files: [file] })) {
      navigator.share({ title: title, files: [file] }).catch(function(e) {
        if (e.name !== 'AbortError') showError('Save failed: ' + e.message);
      });
      return;
    }

    // Fallback: direct download
    var a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob([text], { type: 'text/plain' }));
    a.download = filename;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    showSaveConfirmation('Saved: ' + filename);
  }

  // Export HTML: download the formatted report as an HTML file
  function exportHTML() {
    if (!state.analysisData) return;
    var html = state.shareHTML;
    if (!html) {
      var d = state.analysisData;
      var rt = state.reportType || 'summary';
      html = buildReportHTML(d, rt);
    }
    var d = state.analysisData;
    var slug = (d.sermon_title || 'sermon').toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/-+$/,'');
    var filename = slug + '-' + new Date().toISOString().slice(0,10) + '.html';
    var a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob([html], { type: 'text/html' }));
    a.download = filename;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    showSaveConfirmation('Exported: ' + filename);
  }

  async function pickSaveFolder() {
    if (!window.showDirectoryPicker) {
      showError('Your browser doesn\'t support folder selection. Use Chrome or Edge.');
      return;
    }
    try {
      const handle = await window.showDirectoryPicker({ mode: 'readwrite' });
      state.saveDirHandle = handle;
      document.getElementById('saveFolderName').textContent = handle.name;
      updateSaveFolderDisplay(handle.name);
      // Persist handle in IndexedDB
      const db = await openHandleDB();
      const tx = db.transaction('handles', 'readwrite');
      tx.objectStore('handles').put(handle, 'saveDir');
    } catch (e) {
      if (e.name !== 'AbortError') showError('Could not select folder: ' + e.message);
    }
  }

  async function saveToFolder(dirHandle, filename, text) {
    try {
      const fileHandle = await dirHandle.getFileHandle(filename, { create: true });
      const writable = await fileHandle.createWritable();
      await writable.write(text);
      await writable.close();
    } catch (e) {
      // Permission may have been revoked — fall back to regular download
      showError('Folder access lost. Falling back to regular download.');
      state.saveDirHandle = null;
      document.getElementById('saveFolderName').textContent = 'Default (Downloads)';
      updateSaveFolderDisplay('');
      const ext = filename.endsWith('.html') ? 'text/html' : 'text/plain';
      const a = document.createElement('a');
      a.href = URL.createObjectURL(new Blob([text], { type: ext }));
      a.download = filename;
      a.click();
    }
  }

  function openHandleDB() {
    return new Promise((resolve, reject) => {
      const req = indexedDB.open('SermonRecorderDB', 1);
      req.onupgradeneeded = () => req.result.createObjectStore('handles');
      req.onsuccess = () => resolve(req.result);
      req.onerror = () => reject(req.error);
    });
  }

  // ============ Input Modes ============
  function showInput(mode) {
    const panels = {
      text:    { el: 'textInput',    btn: 'mode-text' },
      youtube: { el: 'youtubeInput', btn: 'mode-youtube' },
      upload:  { el: 'uploadInput',  btn: 'mode-upload' },
    };
    Object.entries(panels).forEach(([key, { el, btn }]) => {
      const isActive = key === mode;
      document.getElementById(el).classList.toggle('visible', isActive);
      document.getElementById(btn).classList.toggle('active', isActive);
    });
  }

  function analyzeFromText() {
    const text = document.getElementById('pasteText').value.trim();
    if (!text || text.length < 50) { showError('Paste more text — too short to analyze.'); return; }
    state.transcript = text;
    document.getElementById('pasteText').value = '';
    analyzeSermon();
  }

  async function analyzeFromYouTube() {
    const url = document.getElementById('youtubeUrl').value.trim();
    if (!url) { showError('Enter a YouTube link.'); return; }

    const videoId = extractVideoId(url);
    if (!videoId) { showError('Invalid YouTube link. Use a standard youtube.com or youtu.be link.'); return; }

    const ytBtn = document.getElementById('ytBtn');
    ytBtn.disabled = true;
    ytBtn.textContent = 'Fetching transcript...';
    hideError();

    try {
      const ytFullUrl = `https://www.youtube.com/watch?v=${videoId}`;
      const transcript = await fetchYouTubeTranscript(ytFullUrl, ytBtn);
      if (!transcript || transcript.length < 50) throw new Error('Could not fetch transcript. The video may not have captions available.');
      state.transcript = transcript;
      document.getElementById('youtubeUrl').value = '';
      ytBtn.textContent = 'Analyze Sermon';
      ytBtn.disabled = false;
      analyzeSermon();
    } catch (err) {
      showError(err.message || 'Could not fetch YouTube transcript.');
      ytBtn.textContent = 'Analyze Sermon';
      ytBtn.disabled = false;
    }
  }

  function onAudioFileChosen(inputEl) {
    const labelEl = document.getElementById('audioFileLabel');
    const file = inputEl.files && inputEl.files[0];
    if (file) {
      labelEl.textContent = `${file.name} (${(file.size / 1024 / 1024).toFixed(1)} MB)`;
      labelEl.classList.add('has-file');
    } else {
      labelEl.textContent = 'Choose audio file…';
      labelEl.classList.remove('has-file');
    }
  }

  async function analyzeFromUpload() {
    const fileInput = document.getElementById('audioFile');
    const file = fileInput.files && fileInput.files[0];
    if (!file) { showError('Choose an audio file to upload.'); return; }

    const upBtn = document.getElementById('uploadBtn');
    upBtn.disabled = true;
    upBtn.textContent = 'Uploading...';
    hideError();

    try {
      const fd = new FormData();
      fd.append('audio', file, file.name);

      // Show progress while uploading. Whisper itself runs server-side after upload completes.
      upBtn.textContent = `Uploading ${(file.size / 1024 / 1024).toFixed(0)}MB...`;
      const r = await fetch(`${WORKER_URL}/api/transcribe-file`, {
        method: 'POST',
        body: fd,
      });

      if (!r.ok) {
        const err = await r.json().catch(() => ({}));
        throw new Error(err.error || `Upload failed (${r.status})`);
      }

      upBtn.textContent = 'Transcribing...';
      const data = await r.json();
      const transcript = data.transcript;
      if (!transcript || transcript.length < 50) {
        throw new Error('Transcript came back empty or too short. The audio may be silent or unintelligible.');
      }

      state.transcript = transcript;
      fileInput.value = '';
      onAudioFileChosen(fileInput);
      upBtn.textContent = 'Analyze Sermon';
      upBtn.disabled = false;
      analyzeSermon();
    } catch (err) {
      showError(err.message || 'Could not transcribe audio.');
      upBtn.textContent = 'Analyze Sermon';
      upBtn.disabled = false;
    }
  }

  function extractVideoId(url) {
    const patterns = [
      /(?:youtube\.com\/watch\?.*v=|youtu\.be\/|youtube\.com\/embed\/|youtube\.com\/v\/|youtube\.com\/shorts\/|youtube\.com\/live\/)([a-zA-Z0-9_-]{11})/,
      /^([a-zA-Z0-9_-]{11})$/
    ];
    for (const p of patterns) {
      const m = url.match(p);
      if (m) return m[1];
    }
    return null;
  }

  async function fetchYouTubeTranscript(ytUrl, statusBtn) {
    // Supadata with mode=auto: tries native captions first, falls back to AI transcription
    try {
      const transcript = await fetchSupadataTranscript(ytUrl, statusBtn);
      if (transcript && transcript.length >= 50) return transcript;
      throw new Error('Transcript too short or empty (got ' + (transcript ? transcript.length : 0) + ' chars)');
    } catch (supadataErr) {
      console.log('Supadata failed:', supadataErr.message);
      throw new Error('Transcription failed: ' + supadataErr.message);
    }
  }

  async function fetchSupadataTranscript(ytUrl, statusBtn) {
    const r = await fetch(`${WORKER_URL}/api/transcript?url=${encodeURIComponent(ytUrl)}`);

    if (!r.ok) {
      const err = await r.json().catch(() => ({}));
      if (r.status === 404) throw new Error('Video not found or is private.');
      if (r.status === 403) throw new Error('Video is restricted or requires authentication.');
      throw new Error(err.message || `Transcript fetch failed (${r.status})`);
    }

    const data = await r.json();

    // Handle async processing (job-based response)
    if (r.status === 202 && data.jobId) {
      const maxPolls = 300; // ~10 minutes (AI transcription of long sermons takes time)
      for (let i = 0; i < maxPolls; i++) {
        const elapsed = Math.round((i * 2) / 60);
        if (statusBtn) statusBtn.textContent = `Transcribing audio${elapsed > 0 ? ` (${elapsed}m)` : ''}... ${Math.round(((i+1)/maxPolls)*100)}%`;
        await new Promise(resolve => setTimeout(resolve, 2000));
        const pollR = await fetch(`${WORKER_URL}/api/transcript/${data.jobId}`);
        const pollData = await pollR.json();
        if (pollData.status === 'completed' && pollData.content) {
          if (typeof pollData.content === 'string') return pollData.content;
          if (Array.isArray(pollData.content)) return pollData.content.map(s => s.text || '').join(' ');
          return pollData.content;
        }
        if (pollData.status === 'failed') throw new Error(pollData.error || 'Transcript processing failed.');
      }
      throw new Error('Transcription timed out — this video may be too long. Try pasting the transcript manually.');
    }

    // Direct response
    if (data.content) {
      if (typeof data.content === 'string') return data.content;
      if (Array.isArray(data.content)) return data.content.map(s => s.text || '').join(' ');
    }

    throw new Error('No captions available');
  }

  // ============ History ============
  function toggleHistory() {
    const panel = document.getElementById('historyPanel');
    panel.classList.toggle('open');
    // Settings panel removed
    if (panel.classList.contains('open')) renderHistory();
  }

  function saveToHistory(analysis) {
    const history = JSON.parse(localStorage.getItem('sermonHistory') || '[]');
    const entry = {
      id: Date.now(),
      date: new Date().toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' }),
      transcript: state.transcript?.substring(0, 500) || '',
      analysis: analysis,
      reportType: state.reportType || 'summary'
    };
    history.unshift(entry);
    if (history.length > 50) history.length = 50;
    localStorage.setItem('sermonHistory', JSON.stringify(history));
  }

  function renderHistory() {
    const history = JSON.parse(localStorage.getItem('sermonHistory') || '[]');
    const el = document.getElementById('historyList');
    if (!history.length) {
      el.innerHTML = '<div class="history-empty">No sermons saved yet</div>';
      return;
    }
    el.innerHTML = history.map(h => `<div class="history-item" onclick="loadFromHistory(${h.id})">
      <div class="history-item-content">
        <div class="history-item-date">${esc(h.date)}</div>
        <div class="history-item-pitch">${esc(h.analysis.sermon_title || h.analysis.elevator_pitch || 'Untitled sermon')}${h.reportType && h.reportType !== 'summary' ? ` <span style="font-size:9px;color:var(--teal);text-transform:uppercase;letter-spacing:0.5px">${esc(h.reportType)}</span>` : ''}</div>
      </div>
      <button class="history-delete" onclick="event.stopPropagation(); deleteFromHistory(${h.id})">×</button>
    </div>`).join('');
  }

  function loadFromHistory(id) {
    const history = JSON.parse(localStorage.getItem('sermonHistory') || '[]');
    const entry = history.find(h => h.id === id);
    if (!entry) return;
    state.analysisData = entry.analysis;
    state.transcript = entry.transcript;
    if (entry.reportType) selectReportType(entry.reportType);
    renderResults(entry.analysis, true);
    document.getElementById('historyPanel').classList.remove('open');
  }

  function deleteFromHistory(id) {
    let history = JSON.parse(localStorage.getItem('sermonHistory') || '[]');
    history = history.filter(h => h.id !== id);
    localStorage.setItem('sermonHistory', JSON.stringify(history));
    renderHistory();
  }

  function showError(msg) { const el = document.getElementById('errorMsg'); el.textContent = msg; el.classList.add('visible'); }
  function hideError() { document.getElementById('errorMsg').classList.remove('visible'); }
</script>
